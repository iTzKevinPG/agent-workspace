# Valores por defecto heredados por todos los agentes.
# Cada agent/*.yaml puede sobreescribir cualquier campo.

model: claude-haiku-4-5   # modelo economico por defecto
max_iter: 5                         # maximo de iteraciones por tarea
verbose: false
allow_delegation: false             # cada agente solo hace su tarea
output_format: markdown             # formato de entrega de resultados
